[project]
name = "bokke-predictions"
version = "0.1.0"
description = "A lightweight Springbok rugby score-prediction pool for a friend group."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "jinja2==3.1.5",
    "python-multipart==0.0.20",
    "itsdangerous==2.2.0",
    "cryptography==43.0.3",
    "qrcode[pil]==8.0",
    "python-dotenv==1.0.1",
    "tzdata==2024.2",
]

[tool.uv]
# This is an application, not a distributable library, so there's nothing to
# build/install for the project itself — uv just manages the dependency env.
package = false
